[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "0.2.0"
description = "Jarvis core — agent runtime, provider gateway and tool host"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "tomlkit>=0.13",
    "psutil>=6.1",
]

[project.optional-dependencies]
# Secrets live in the OS credential store. Separated so the core imports and
# tests without a desktop keyring present (headless CI, containers).
secrets = ["keyring>=25.5"]
windows = ["pywin32>=308", "comtypes>=1.4", "uiautomation>=2.0", "wmi>=1.5.1"]
voice = ["faster-whisper>=1.1", "sounddevice>=0.5", "webrtcvad>=2.0.10", "piper-tts>=1.2", "openwakeword>=0.6", "onnxruntime>=1.20"]
local-llm = ["llama-cpp-python>=0.3"]
documents = ["pypdf>=5.1", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0", "pillow>=11.0"]
browser = ["playwright>=1.49"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "coverage>=7.6", "respx>=0.21"]

[project.scripts]
jarvis-core = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:jarvis.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = [
    "S101",  # pytest uses assert
    "N818",  # our error names read better without the Error suffix convention
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test fixtures use literal dummy tokens

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Optional extras are absent in a base install; their stubs are not required.
ignore_missing_imports = true

# The Windows adapter calls APIs that do not exist on Linux at all — `winreg`,
# `ctypes.WinDLL`, `WINFUNCTYPE`, `get_last_error`. CI runs on Linux, so mypy
# cannot resolve them and would report every one as an error. The module is
# still type-checked for everything else; only the platform-absent attributes
# are exempt. It is the one module that needs a Windows machine to verify.
[[tool.mypy.overrides]]
module = "jarvis.platform_.win32"
disable_error_code = ["attr-defined", "untyped-decorator", "no-any-return"]
