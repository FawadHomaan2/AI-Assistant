name: Release

# Publishes an installer on a version tag, and gives it a permanent download
# link — which a workflow artifact is not: those expire and need a GitHub
# login.
#
# **Signing is optional.** A release and an update are different things, and
# conflating them was a mistake in the first version of this file: it refused
# to publish at all without a signing key, which meant no download link until
# one existed. A plain download needs no signature. The in-app updater does.
#
# So:
#
#   no signing key   → installer published. Download and install it by hand;
#                      the updater stays switched off and says so.
#   signing key set  → installer published, signed, with `latest.json` beside
#                      it, and every installed copy sees the update.
#
# To get the second, generate a keypair with `npm run tauri signer generate`
# and add two repository secrets:
#
#   TAURI_SIGNING_PRIVATE_KEY           the private key's contents
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the passphrase set when generating it
#
# then put the public key in `apps/desktop/src-tauri/tauri.conf.json`. The
# endpoint there is already filled in. See docs/UPDATES.md.
#
# `latest.json` is written by the step below rather than by a third-party
# action, so the only things with a hand on a release are GitHub's own actions
# and this file.

on:
  push:
    tags:
      - 'v*'
  # Two jobs in one: retrying a failed publish without moving the tag, and
  # publishing a tag that does not exist yet. The second matters because
  # creating a tag needs push access to the repository, while running this
  # workflow needs only the ability to start it — the release step creates the
  # tag at the dispatched commit using the workflow's own token.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (created at this ref if it does not exist)'
        required: true
      move_tag:
        description: 'Repoint the tag if it already exists elsewhere'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          # Not the `tag` input: on a dispatch that tag may not exist yet, and
          # checking it out would fail before anything is built. `github.ref` is
          # the tag on a tag push and the dispatched branch otherwise — the
          # commit to build, either way.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Decided once, up front, so every later step agrees about it and the
      # release notes can say which kind of release this is.
      - name: Decide whether this release can be signed
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "A signing key is present: this release will carry update artifacts."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY, so this release is a plain"
            echo "::notice::download: no signature and no latest.json, and the in-app"
            echo "::notice::updater stays switched off. See docs/UPDATES.md to enable it."
          fi

      # The tag and the version in tauri.conf.json have to agree: the updater
      # compares the manifest's version against the running build's, so a
      # mismatch either offers an update that installs the same version or
      # hides one that exists.
      - name: Check the tag matches the configured version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CONFIGURED=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$CONFIGURED" ]; then
            echo "::error::Tag $TAG does not match version $CONFIGURED in tauri.conf.json."
            echo "::error::Bump the version, commit, then tag v$CONFIGURED."
            exit 1
          fi

      - name: Build the core sidecar
        working-directory: services/jarvis
        run: |
          pip install -e ".[documents,secrets]"
          pip install pyinstaller
      - name: Freeze and smoke-test the core
        working-directory: .
        run: python scripts/build_core.py

      - run: npm ci

      # Two build steps rather than one with a conditional argument, because
      # `createUpdaterArtifacts` makes the build *require* a key — passing it
      # without one fails, and passing it conditionally inside one shell line
      # is where this gets quietly wrong.
      - name: Build the installer (signed, with update artifacts)
        if: steps.signing.outputs.enabled == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Build the installer (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: npm run tauri build

      # `fail_on_unmatched_files: false` below is needed because two of the
      # three publish patterns match nothing on an unsigned build — which also
      # removes the safety net from the installer itself. Without this check, a
      # bundler that named the file something other than `*-setup.exe` would
      # publish a release with no assets at all: a download link that hands
      # someone nothing, and no failed job to say so.
      - name: Check the installer was produced
        shell: bash
        run: |
          BUNDLE=src-tauri/target/release/bundle/nsis
          if ! ls "$BUNDLE"/*-setup.exe >/dev/null 2>&1; then
            echo "::error::No *-setup.exe in $BUNDLE, so there is nothing to publish."
            echo "Contents of the bundle directory:"
            ls -la "$BUNDLE" 2>/dev/null || echo "(the directory does not exist)"
            exit 1
          fi
          echo "installer: $(ls "$BUNDLE"/*-setup.exe)"

      - name: Write latest.json
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BUNDLE=src-tauri/target/release/bundle/nsis

          INSTALLER=$(ls "$BUNDLE"/*-setup.exe | head -1)
          SIGFILE="${INSTALLER}.sig"
          if [ ! -f "$SIGFILE" ]; then
            echo "::error::No signature beside $INSTALLER although a key was set."
            exit 1
          fi

          # Read from the .sig rather than recomputing, so the manifest
          # describes the artifact that was actually built.
          SIG=$(cat "$SIGFILE")
          NAME=$(basename "$INSTALLER")

          cat > "$BUNDLE/latest.json" <<JSON
          {
            "version": "${TAG#v}",
            "notes": "See https://github.com/${REPO}/releases/tag/${TAG}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${NAME}"
              }
            }
          }
          JSON
          echo "wrote latest.json for $NAME"

      # Created here rather than left to the release action, which creates a
      # missing tag at `target_commitish` — defaulting to the repository's
      # default branch, not the ref it was dispatched from. That published
      # v0.2.0 pointing at a commit declaring version 0.1.0, with the code that
      # was actually built not in the tag's history at all. The binary was
      # right and the tag was wrong, and nothing in the job noticed.
      - name: Create or check the tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MOVE: ${{ github.event.inputs.move_tag }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          EXISTING=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            gh api -X POST "repos/$REPO/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$SHA" >/dev/null
            echo "created $TAG at $SHA"
          elif [ "$EXISTING" = "$SHA" ]; then
            echo "$TAG already points at $SHA"
          elif [ "$MOVE" = "true" ]; then
            # Explicit, never the default: moving a tag someone may already
            # have fetched is not something to do by accident.
            gh api -X PATCH "repos/$REPO/git/refs/tags/$TAG" \
              -F force=true -f "sha=$SHA" >/dev/null
            echo "::warning::moved $TAG from $EXISTING to $SHA"
          else
            echo "::error::$TAG already exists at $EXISTING, but this build is $SHA."
            echo "::error::Re-run with move_tag enabled to repoint it, or use a new tag."
            exit 1
          fi

      # Said on the release itself, so someone landing on the page knows
      # whether this one can be installed over an older copy automatically.
      - name: Compose the release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES'
            echo '## Install'
            echo
            echo 'Download the `.exe` below and run it. It installs per-user into'
            echo '`%LOCALAPPDATA%\Programs\Jarvis` — no administrator rights and no UAC prompt.'
            echo
            echo 'The build is **unsigned**, so SmartScreen will warn about an unknown'
            echo 'publisher: **More info → Run anyway**. That is the missing code-signing'
            echo 'certificate, not a problem with the build.'
            echo
            echo 'Installing over an existing copy keeps everything in `%LOCALAPPDATA%\jarvis`:'
            echo 'conversations, learned memory, the audit log, permissions, plugins and every'
            echo 'downloaded model. Only the program is replaced.'
            echo
            if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
              echo '## Updating'
              echo
              echo 'This release carries `latest.json` and a signature, so installed copies'
              echo 'will offer it under **Settings → Updates**.'
            else
              echo '## Updating'
              echo
              echo 'This release is **not signed for the in-app updater**, so installed copies'
              echo 'will not offer it — install it by hand. Setting up automatic updates needs'
              echo 'a signing keypair; see `docs/UPDATES.md`.'
            fi
            echo
            echo '## Voice'
            echo
            echo 'The wake word does **not** work from this installer: the frozen core excludes'
            echo '`onnxruntime` and `openwakeword`, and reports them missing. For "Hey Jarvis",'
            echo 'run from a source checkout with the `voice` extra — see the README.'
            echo RELEASE_NOTES
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Not a draft: the updater reads latest.json from the release assets,
          # and a draft's assets are not public, so the manifest would 404 for
          # everyone it is meant to serve.
          draft: false
          body: ${{ steps.notes.outputs.body }}
          # The signature and manifest are only produced for a signed build, so
          # two of these patterns match nothing on an unsigned one. Set
          # explicitly rather than relying on the action's default.
          fail_on_unmatched_files: false
          # Without this the action creates a missing tag on the default
          # branch. Harmless on a tag push, where the tag already exists; the
          # step above makes it a no-op either way, and this closes the gap if
          # that step is ever reordered.
          target_commitish: ${{ github.sha }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json

      # The check that was missing. "Does the tag match the version in the
      # checkout" is about intent; this is about the result, and it is the one
      # that catches a tag landing on a different commit than the installer was
      # built from.
      - name: Check the published tag points at what was built
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          POINTS_AT=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')
          if [ "$POINTS_AT" != "$SHA" ]; then
            echo "::error::$TAG points at $POINTS_AT but the installer was built from $SHA."
            echo "::error::Anyone checking out the tag would not get the code they downloaded."
            exit 1
          fi
          echo "$TAG points at $SHA, which is what was built."
